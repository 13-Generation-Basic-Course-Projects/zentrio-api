<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Your Email</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://i.imgur.com/example-background.jpg') no-repeat center center fixed;
            background-size: cover;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .email-wrapper {
            max-width: 640px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 48px 32px;
            text-align: center;
        }
        .header {
            margin-bottom: 32px;
            text-align: left;
        }
        .logo {
            display: inline-block;
            width: 120px;
            height: auto;
        }
        .verify-image {
            margin-bottom: 16px;
            max-width: 100%;
            height: auto;
        }
        .heading {
            font-size: 28px;
            font-weight: 700;
            color: #1a202c;
            margin: 16px 0 8px;
        }
        .subheading {
            font-size: 16px;
            color: #808080;
            margin: 0;
        }
        .special-subheading {
            font-size: 16px;
            color: #59BAD5;
            margin: 0;
        }
        .otp-container {
            margin: 32px 0;
        }
        .otp-box {
            display: inline-block;
            border: 1px solid #e2e8f0;
            color: #59BAD5;
            font-size: 40px;
            font-weight: 800;
            letter-spacing: 8px;
            padding: 24px 32px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(5px);
        }
        .info-text {
            font-size: 14px;
            color: #4a5568;
            margin: 0 16px 32px;
        }
        .info-text strong {
            color: #2d3748;
        }
        .action-text {
            font-size: 14px;
            color: #4a5568;
            margin-bottom: 32px;
        }
        .action-text a {
            color: #3182ce;
            text-decoration: none;
            font-weight: 600;
        }
        .action-text a:hover {
            text-decoration: underline;
        }
        .footer {
            font-size: 12px;
            color: #a0aec0;
            border-top: 1px solid #edf2f7;
            padding-top: 24px;
            margin-top: 32px;
        }
        .footer a {
            color: #3182ce;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        @media only screen and (max-width: 600px) {
            .email-wrapper {
                padding: 32px 24px;
                margin: 24px 16px;
            }
            .heading {
                font-size: 24px;
            }
            .otp-box {
                font-size: 32px;
                letter-spacing: 6px;
                padding: 16px 24px;
            }
            .logo {
                width: 100px;
            }
        }
    </style>
</head>
<body>
<div class="email-wrapper">
    <div class="header">
        <img class="logo" src="src/assets/zentrio-logo.png" alt="Zentrio Logo">
    </div>
    <div class="otp-container">
        <img class="verify-image" src="src/assets/verify-otp.jpg" alt="Verify OTP">
        <h1 class="heading">Welcome to Zentrio</h1>
        <h2 class="special-subheading">You're One Step Away</h2>
        <p class="subheading">To complete your registration, verify your email address by using this secure OTP below!</p>
        <div class="otp-box">123456</div>
        <p class="info-text">Note: This code will expire in 3 minutes.</p>
        <p class="action-text">Have a question? <a href="https://zentriokshrd.com">Reach out to our team</a></p>
    </div>
    <div class="footer">
        © 2025 Zentrio. All rights reserved.<br>
        <a href="https://zentriokshrd.com/privacy">Privacy Policy</a> |
        <a href="https://zentriokshrd.com/terms">Terms of Service</a>
    </div>
</div>
</body>
</html>
